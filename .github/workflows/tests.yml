name: Yolda V2 testleri

on:
  push:
    branches: [main, auto]
    paths-ignore:
      - "kanallar/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_ARGS: '-PABI=x86_64 -PAPP_NAME=YoldaV2 -PAPP_ID_SFX=.yoldav2'

jobs:
  # Hızlı: cihaz gerektirmeyen mantık (sesli komut çözümleme, kapak adresi, süre, reklam filtresi)
  birim:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: NDK sürümü
        run: echo "ANDROID_NDK_VERSION=$(grep -Po '(?<=ndkVersion).+' gradle/libs.versions.toml | sed -e 's/[= \"]//g')" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri
        env:
          NO_GS: true
        run: |
          chmod +x gradlew
          # Yalnız Yolda testleri (Fermata'nın eski altyazı testi CI'da takılıyor)
          ./gradlew fermata:testAutoDebugUnitTest --tests 'me.aap.fermata.ui.fragment.YoldaLogicTest' --tests 'me.aap.fermata.ui.fragment.YoldaDeckTest'             web:testAutoDebugUnitTest --tests 'me.aap.fermata.addon.web.AdFilterTest' $GRADLE_ARGS
      - name: Sonuçlar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birim-test-raporu
          path: |
            fermata/build/reports/tests/
            modules/web/build/reports/tests/
          retention-days: 14

  # Uygulama emülatörde gerçekten açılır: ekranlar, sesli komutlar, oynatıcı, döndürme, müzik araması
  fonksiyonel:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Disk boşalt (emülatöre yer kalsın)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost             /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift /usr/local/julia* || true
          df -h /
      - uses: actions/checkout@v4
      - name: NDK sürümü
        run: echo "ANDROID_NDK_VERSION=$(grep -Po '(?<=ndkVersion).+' gradle/libs.versions.toml | sed -e 's/[= \"]//g')" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android NDK önbelleği
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ${{ runner.os }}-android-ndk-${{ env.ANDROID_NDK_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Hey Yolda ses modeli önbelleği
        uses: actions/cache@v4
        with:
          path: fermata/src/main/assets/vosk-tr.zip
          key: vosk-model-small-tr-0.3
      - name: Hey Yolda ses modeli ve sentetik "hey yolda" sesleri
        run: |
          mkdir -p fermata/src/main/assets fermata/src/androidTest/assets
          if [ ! -s fermata/src/main/assets/vosk-tr.zip ]; then
            curl -fsSL --retry 3 -o fermata/src/main/assets/vosk-tr.zip https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip
          fi
          sudo apt-get install -y -q espeak-ng >/dev/null 2>&1 || true
          if command -v espeak-ng >/dev/null; then
            A=fermata/src/androidTest/assets
            espeak-ng -v tr -s 140 -w /tmp/a.wav "hey yolda" && ffmpeg -loglevel error -y -i /tmp/a.wav -ar 16000 -ac 1 -c:a pcm_s16le $A/hey_yolda.wav
            espeak-ng -v tr -s 120 -p 40 -w /tmp/b.wav "hey, yolda" && ffmpeg -loglevel error -y -i /tmp/b.wav -ar 16000 -ac 1 -c:a pcm_s16le $A/hey_yolda_2.wav
            espeak-ng -v tr -s 140 -w /tmp/c.wav "yolda" && ffmpeg -loglevel error -y -i /tmp/c.wav -ar 16000 -ac 1 -c:a pcm_s16le $A/yolda.wav
            ls -la $A
          fi
      - name: Test APK'larını derle
        env:
          NO_GS: true
        run: |
          chmod +x gradlew
          ./gradlew fermata:assembleAutoDebug fermata:assembleAutoDebugAndroidTest $GRADLE_ARGS
      - name: Emülatörde fonksiyonel testler
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NO_GS: true
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 3000M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash .github/scripts/android-tests.sh
      - name: Sonuçlar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonksiyonel-test-raporu
          path: test-sonuclari/
          retention-days: 14
